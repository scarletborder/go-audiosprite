# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'  # 推送 v1.0.0, v2.1.0 等 tag 时触发 release
  pull_request:
    branches: [ "main" ]

jobs:
  # 测试任务
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: Test
      run: go test -v ./...

  # 构建多平台二进制文件
  build:
    runs-on: ubuntu-latest
    needs: test  # 测试通过后才构建
    strategy:
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64]
        exclude:
          # 排除一些不常见的组合（可选）
          - os: windows
            arch: arm64
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: Get module name
      id: modname
      run: echo "name=$(go mod edit -json | jq -r .Module.Path | xargs basename)" >> $GITHUB_OUTPUT

    - name: Build binary
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
      run: |
        # 设置输出文件名
        OUTPUT_NAME="${{ steps.modname.outputs.name }}-${{ matrix.os }}-${{ matrix.arch }}"
        if [ "${{ matrix.os }}" = "windows" ]; then
          OUTPUT_NAME="${OUTPUT_NAME}.exe"
        fi
        
        go build -v -o "bin/$OUTPUT_NAME" ./...
        
        # 保存文件名供后续使用
        echo "output_name=$OUTPUT_NAME" >> $GITHUB_OUTPUT

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.modname.outputs.name }}-${{ matrix.os }}-${{ matrix.arch }}
        path: bin/${{ steps.modname.outputs.name }}-${{ matrix.os }}-${{ matrix.arch }}*
        if-no-files-found: error

  # 创建 Release 并上传所有二进制文件
  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')  # 仅在 tag 推送时创建 release
    permissions:
      contents: write  # 需要写入权限来创建 release
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        pattern: '*'
        merge-multiple: true

    - name: List artifacts
      run: ls -la artifacts/

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/*
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
